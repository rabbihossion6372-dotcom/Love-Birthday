<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Moonu's Surprise ⚡ Love Reactor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Shadows+Into+Light&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Ambient background canvas for plasma arcs, lightning & supernova particles -->
  <canvas id="fxCanvas"></canvas>
  
  <!-- Flash overlay for detonation -->
  <div id="flashOverlay" class="flash-overlay"></div>

  <!-- Audio mute/unmute toggle -->
  <button id="soundToggle" class="sound-toggle" title="Toggle Sound FX" aria-label="Toggle Sound">
    <span id="soundIcon">🔊</span>
  </button>

  <main class="container">
    <!-- Original Heart Form -->
    <form id="heartForm" onsubmit="return false;">
      <div class="wrapper" id="heartWrapper">
        <input type="checkbox" id="ck1" onchange="check()"/>
        <label for="ck1">I</label>
        <input type="checkbox" id="ck2" onchange="check()"/>
        <label for="ck2">love</label>
        <input type="checkbox" id="ck3" onchange="check()"/>
        <label for="ck3">you "Moonu Toonu" &#129392;</label>
        <span class="hint-text">(Click on words)</span>
      </div>
    </form>

    <!-- Biometric Love Reactor Console -->
    <section class="reactor-console" id="reactorConsole">
      <!-- HUD Telemetry -->
      <div class="hud-panel">
        <div class="hud-status" id="hudStatus">
          <span class="status-dot"></span>
          <span class="status-label" id="statusLabel">SYSTEM READY • HOLD TO CHARGE</span>
        </div>
        <div class="hud-metrics">
          <div class="metric-item">
            <span class="metric-name">LOVE POWER</span>
            <span class="metric-val" id="powerMetric">0%</span>
          </div>
          <div class="metric-item">
            <span class="metric-name">CORE TEMP</span>
            <span class="metric-val" id="tempMetric">36.5°C</span>
          </div>
          <div class="metric-item">
            <span class="metric-name">REACTOR</span>
            <span class="metric-val" id="voltageMetric">STANDBY</span>
          </div>
        </div>
      </div>

      <!-- Biometric Scanner Pad -->
      <div class="scanner-pod">
        <div class="scanner-ring-container">
          <!-- Circular SVG Progress Ring -->
          <svg class="progress-ring" viewBox="0 0 160 160">
            <circle class="progress-ring-bg" cx="80" cy="80" r="68" />
            <circle class="progress-ring-track" id="progressTrack" cx="80" cy="80" r="68" />
          </svg>

          <!-- Fingerprint Touch Pad -->
          <button type="button" class="scanner-pad" id="scannerBtn" aria-label="Hold thumb to charge love reactor">
            <!-- Pulsing aura ripples -->
            <div class="scanner-glow"></div>
            <div class="scanner-ripple"></div>
            
            <!-- Laser Scan Line -->
            <div class="laser-bar" id="laserBar"></div>

            <!-- Fingerprint SVG Graphic -->
            <svg class="fingerprint-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2a10 10 0 0 0-10 10c0 3 1.5 6 3.5 8" />
              <path d="M7 10a5 5 0 0 1 10 0c0 4-1.5 7-3.5 10" />
              <path d="M12 6a6 6 0 0 0-6 6c0 3.5 2 6.5 4 9" />
              <path d="M12 14a2 2 0 0 0 2-2c0-1.1-.9-2-2-2s-2 .9-2 2a2 2 0 0 0 2 2z" />
              <path d="M12 18a6 6 0 0 0 3-1" />
              <path d="M17 12a5 5 0 0 0-1-3" />
            </svg>
          </button>
        </div>

        <p class="scanner-prompt" id="scannerPrompt">
          <span class="prompt-icon">👆</span> PRESS &amp; HOLD THUMB TO CHARGE
        </p>
      </div>

      <!-- Overload Victory Love Declaration Banner (Revealed on 100%) -->
      <div class="overload-banner" id="overloadBanner">
        <div class="banner-badge">⚡ 100% CRITICAL OVERLOAD ⚡</div>
        <h2 class="banner-title">UNCONDITIONAL LOVE DETECTED</h2>
        <p class="banner-message" id="bannerMessage">
          "Moonu Toonu, my heart's reactor generates infinite energy only for you. Forever and always! 🥰💖"
        </p>
        <button type="button" class="recharge-btn" id="rechargeBtn">
          <span>⚡ RE-CHARGE REACTOR ⚡</span>
        </button>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
